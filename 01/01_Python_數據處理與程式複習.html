<script>
'use strict';
// Store the teaching content separately from visual rendering.

const slides = [{"section":1,"kind":"cover","title":"一筆活動紀錄，如何變成可分析的資料？","lead":"從 Python 基礎出發，將真實情境轉成資料、規則與計算。","observe":"點選三個工具，看看同一份校園活動資料如何逐步變成分析結果。","think":"園遊會的準備時數、工作項目與小組名稱，可以如何記錄？","code":""},{"section":1,"kind":"pipeline","title":"從現場紀錄到程式處理","lead":"同一件事情，可以用文字、欄位及計算流程來表達。","observe":"依序點選「觀察、整理、判斷」，看看 Python 如何把活動紀錄轉成可以處理的資料。","think":"如果想找出最忙碌的小組，需要先取得哪些資料？","code":""},{"section":1,"kind":"types","title":"Python 的四種基本資料型態","lead":"數字、文字、真假值不同，決定它們能做哪些運算。","observe":"選擇 int、float、str、bool，看值、型態和常見用途如何對應。","think":"為什麼 \"3\" 與 3 看起來相同，卻不能直接相加？","code":"type(3.5)"},{"section":1,"kind":"operation","title":"變數能讓計算隨資料改變","lead":"把數值命名後，修改輸入就能重新計算結果。","observe":"拖曳「準備時數」，即時計算每小時完成 2 項任務的預估成果。","think":"如果時數從 2 變成 4，結果為什麼跟著變？","code":"hours = 3\ntasks = hours * 2"},{"section":1,"kind":"list","title":"list：把同一類資料排成一列","lead":"list 使用 [ ]，把多筆資料依順序排在一起；第一筆的索引是 0。","observe":"移動索引，觀察 list 的 [ ] 如何取出不同位置的時數。","think":"最後一筆資料是索引 7 還是 8？","code":"hours = [2, 4, 3, 5, 1, 3, 4, 2]\nhours[0]"},{"section":1,"kind":"dict","title":"dict：用 { } 記錄資料，也能再放一層","lead":"dict 用 { } 配對 key 和 value；value 也可以是另一個 dict。","observe":"先切換單層／巢狀，再點選欄位。巢狀 dict 會用兩次 [ ] 逐層取值。","think":"若時數放在 info 裡，應先找 info，還是直接找 hours？","code":""},{"section":1,"kind":"condition","title":"if／else：把條件變成判斷","lead":"布林條件只有 True／False，會決定走哪條執行路徑。","observe":"調整準備時數，比較 >= 3 與 < 3 時走的分支。","think":"剛好等於 3 時，會進入哪個分支？","code":"hours = 3\nif hours >= 3:\n    status = \"達標\"\nelse:\n    status = \"未達標\""},{"section":1,"kind":"loop","title":"for 迴圈：逐筆累加而不重複寫程式","lead":"迴圈每次讀一個元素，依序更新目前的總和。","observe":"按「下一筆」觀察目前處理的項目與累積任務數。","think":"同樣的加總如果有 100 筆資料，為什麼用迴圈更合適？","code":"tasks = [3, 5, 4, 8]\ntotal = 0\nfor task in tasks:\n    total += task"},{"section":1,"kind":"function","title":"函式：把可以重複的步驟命名","lead":"參數是輸入，return 將計算結果帶回函式外。","observe":"改變傳入時數，看同一個 get_tasks 函式如何計算不同結果。","think":"如果沒有 return，能否直接取得這個計算結果？","code":"def get_tasks(hours):\n    return hours * 2\n\nget_tasks(3)"},{"section":1,"kind":"structure","title":"list [ ] 和 dict { }：資料還能一層包一層","lead":"list 用 [ ] 排順序；dict 用 { } 存鍵和值，兩種結構還能互相包含。","observe":"切換 list、dict、巢狀結構，觀察括號、資料位置與取值方式。","think":"若 info 裡的 days 是 list，如何取得第一個星期名稱？","code":""},{"section":1,"kind":"quiz","title":"第一節快速檢核","lead":"檢查資料型態、list 索引與 if 條件，確認 Python 基礎已掌握。","observe":"直接點選答案；答錯會提供線索，答對後才出現完整說明。","think":"完成三題後，下一節才開始認識 NumPy 的陣列。","code":"","questions":[{"q":"以下哪個值是 Python 的 str（字串）？","opts":["3","\"3\"","3.0","True"],"ok":1,"hint":"想想哪一個值被引號包住。","why":"\"3\" 是文字，因此屬於 str；3 是 int、3.0 是 float，而 True 是 bool。"},{"q":"已知 hours = [2, 4, 3]，hours[0] 是多少？","opts":["0","2","3","4"],"ok":1,"hint":"Python 的第一個元素從索引 0 開始。","why":"索引 0 對應第一筆，因此 hours[0] = 2；索引 1 才是第二筆 4。"},{"q":"條件 hours >= 3，當 hours = 3 時結果為何？","opts":["True","False","出現錯誤","回傳數字 3"],"ok":0,"hint":">= 同時包含「大於」與「等於」。","why":"3 >= 3 為 True。比較運算得到布林值，可交給 if 判斷。"}]},{"section":2,"kind":"intro2","title":"NumPy 的 array：為什麼與 Python list 不一樣？","lead":"list 的 * 代表重複序列；NumPy array 的 * 則是逐元素數值乘法。","observe":"切換 list 與 array，觀察同一組 [2, 4, 3] 乘以 2 的不同結果。","think":"想把每筆時數加倍，哪一種資料結構能直接得到 [4, 8, 6]？","code":""},{"section":2,"kind":"array","title":"ndarray：從一維到二維","lead":"shape 描述每個軸有多少元素，索引仍從 0 開始。","observe":"切換維度，觀察 shape、元素數量、資料排列方式。","think":"shape = (3, 4) 是 3 列 4 欄，還是 4 列 3 欄？","code":"import numpy as np\na = np.array([[2, 4, 3], [1, 3, 5]])"},{"section":2,"kind":"slice","title":"索引與切片：start 包含、stop 不包含","lead":"切片 a[start:stop] 取出連續區間，stop 的元素不會取到。","observe":"調整開始和結束位置，藍色元素就是切片結果。","think":"a[2:5] 包含索引 5 嗎？","code":"a[start:stop]"},{"section":2,"kind":"matrix","title":"二維索引：先列，再欄","lead":"a[row, col] 用兩個索引精確找到表格中的一格。","observe":"點選任一儲存格，對照列、欄索引與取出的數字。","think":"a[1, 2] 是第幾列、第幾欄？","code":"a[row, col]"},{"section":2,"kind":"broadcast","title":"向量化：一次更新整批資料","lead":"將一個數加到陣列，NumPy 會對每個元素執行數值運算。","observe":"調整額外增加的時數，前後長條與平均值同步更新。","think":"如果所有元素加 2，平均數也增加多少？","code":"new = hours + 2"},{"section":2,"kind":"pair","title":"list 相加與 array 相加，真的一樣嗎？","lead":"list + list 是串接；NumPy array + array 是逐元素相加。","observe":"按兩種資料型態比較同樣的 + 符號會得到什麼結果。","think":"要把每組兩天的完成任務數相加，應使用哪種資料結構？","code":"np.array([1, 2, 3]) + np.array([4, 5, 6])"},{"section":2,"kind":"mask","title":"條件篩選：讓布林陣列幫忙選資料","lead":"條件 a >= k 會對每個元素產生 True／False，再留下符合者。","observe":"移動門檻，看被保留的時數、筆數和數值如何改變。","think":"門檻拉高後，符合條件的筆數會增加嗎？","code":"good = hours[hours >= 3]"},{"section":2,"kind":"stats","title":"sum、mean、min、max：四種摘要問題","lead":"不同統計量回答不同問題；選對指標才有意義。","observe":"切換統計指標，圖表會標示計算用到的數字與結果。","think":"平均數和最大值，哪一個更能表示一般水準？","code":"np.mean(hours)"},{"section":2,"kind":"axis","title":"axis：沿著哪個方向統計？","lead":"axis=0 沿列方向彙整每一欄；axis=1 沿欄方向彙整每一列。","observe":"切換 axis，觀察每欄平均與每列平均對應的區域。","think":"3×4 表格沿 axis=0 平均後，得到幾個數值？","code":"a.mean(axis=0)"},{"section":2,"kind":"labnum","title":"小練習：先加工，再篩選，最後統計","lead":"在同一份資料上連續套用運算，比較前後統計結果。","observe":"先調整「每筆加多少」，再設定篩選門檻；系統即時計算留下的平均。","think":"若沒有任何資料符合門檻，平均數該怎麼表示？","code":"new = hours + 2\ngood = new[new >= 4]"},{"section":2,"kind":"quiz","title":"第二節快速檢核","lead":"檢查切片、向量化與 axis 的方向是否理解。","observe":"每題可反覆嘗試；切換題目使用題目按鈕，不影響投影片導覽。","think":"掌握陣列運算後，接下來就能整理表格資料。","code":"","questions":[{"q":"a = np.array([2, 4, 6, 8])，a[1:3] 的結果？","opts":["[2, 4, 6]","[4, 6]","[4, 6, 8]","[2, 4]"],"ok":1,"hint":"從索引 1 開始，停止位置 3 不包含。","why":"索引 1、2 分別是 4、6，因此切片得到 [4, 6]。"},{"q":"np.array([2, 4]) * 2 的結果？","opts":["[2, 4, 2, 4]","[4, 8]","[2, 8]","會出現錯誤"],"ok":1,"hint":"NumPy 的 * 是逐元素數值乘法，不是 list 重複。","why":"NumPy 將陣列中的 2 和 4 分別乘以 2，因此得到 [4, 8]。"},{"q":"3 列 4 欄的陣列做 mean(axis=0)，結果有幾個值？","opts":["3","4","7","12"],"ok":1,"hint":"axis=0 是沿著列方向聚合，每一欄留下一個值。","why":"資料有 4 欄，所以逐欄平均後得到 4 個平均值；mean(axis=1) 則得到 3 個。"}]},{"section":3,"kind":"intro3","title":"從 CSV 表格出發，完成第一次資料清理","lead":"Pandas 將欄位清楚的資料整理成 DataFrame，並協助篩選與統計。","observe":"前兩節使用完整的練習數字；現在讀取原始活動紀錄 CSV，練習辨識其中一筆缺漏。","think":"原始 CSV 的 F 時數未填，和前面完整練習陣列有何不同？","code":""},{"section":3,"kind":"csv","title":"CSV：每一列是一筆紀錄","lead":"逗號分隔值（Comma-Separated Values, CSV）以一行標題與多行資料表示表格。","observe":"切換原始 CSV 文字與表格檢視；可匯出相同的範例 CSV。","think":"為什麼缺漏資料要保留空欄，而不是任意填入 0 let page=0,overlay='',state={};
const root=document.getElementById('deck');
function ss(){return state[page]||(state[page]={choice:0,index:0,h:3,bins:4,step:0,start:1,end:5,row:1,col:2,bonus:2,k:3,stat:0,axis:0,mode:0,q:0,answered:false,wrong:false,fill:0,group:0});}
function escapeHTML(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmt(x){return Number.isFinite(x)?(Math.round(x*100)/100).toLocaleString('zh-TW',{maximumFractionDigits:2}):'無資料';}
function sum(a){return a.reduce((v,x)=>v+x,0);}
function mean(a){return a.length?sum(a)/a.length:NaN;}
function median(a){if(!a.length)return NaN;const b=[...a].sort((x,y)=>x-y);return (b[Math.floor((b.length-1)/2)]+b[Math.floor(b.length/2)])/2;}
function pill(x){return `<span class="bluepill">${escapeHTML(x)}</span>`;}
function values(a,classes=()=>'',caption=''){return `<div class="arrrow">${a.map((x,i)=>`<div class="arraycell ${classes(i)}"><span class="ix">${i}</span>${escapeHTML(x)}</div>`).join('')}</div>${caption?`<div class="arr-caption">${caption}</div>`:''}`;}
function linebars(labels,a,{highlight=[],max,unit='',missing=[]}={}){
  const vmax=max||Math.max(1,...a.map(x=>Math.abs(x)));const available=492;
  const ss=a.map((v,i)=>{
    const y=10+i*(242/a.length),w=Math.max(0,Math.round(available*v/vmax));
    const color=highlight.includes(i)?'#0c9f96':'#557be5';
    return `<text x="13" y="${y+19}" fill="#536d88" font-size="16" font-weight="800">${escapeHTML(labels[i])}</text><rect x="83" y="${y+3}" width="492" height="21" fill="#f0f4fa" rx="5"/><rect x="83" y="${y+3}" width="${w}" height="21" rx="5" fill="${color}"/><text x="${Math.min(645,89+w)}" y="${y+19}" font-size="15" fill="#315477" font-weight="800">${missing.includes(i)?'缺漏':fmt(v)+unit}</text>`;
  }).join('');
  return `<svg class="chartSvg" viewBox="0 0 690 265" aria-label="根據資料數值呈現的長條圖">${ss}<line x1="83" y1="257" x2="574" y2="257" stroke="#8fa6c1" stroke-width="1.4"/></svg>`;

// Use one canonical record list to derive grouping and chart measurements.
// 使用單一活動紀錄來源計算分組及各種圖表數據。
function chartGroups(kind){
  return groups.map(g=>{
    const data=rows.filter(r=>r.group===g);
    if(kind==='total')return sum(data.map(r=>r.tasks));
    if(kind==='average')return mean(data.filter(r=>r.hours!==null).map(r=>r.hours));
    if(kind==='count')return data.length;

  });

// Draw a labeled vertical bar chart with dynamically scaled axes.
// 繪製含完整座標軸與數值標籤的動態垂直長條圖。
function mplBarChart(data,labels,{unit='',max=null,colors=null}={}){
  const color=colors||['#5277df','#19a49d','#f0a156'];
  const upper=max||Math.ceil(Math.max(...data,1)*1.15);
  const x0=78,y0=246,height=184,width=567,step=width/data.length,bar=Math.min(110,step*.57);
  const tickCount=upper===6?3:4;
  const grid=Array.from({length:tickCount+1},(_,i)=>{
    const k=i/tickCount,v=upper*k,y=y0-k*height;
    return `<line x1="${x0}" y1="${y}" x2="${x0+width}" y2="${y}" stroke="#dfebf5" stroke-dasharray="4 4"/><text x="${x0-15}" y="${y+5}" font-size="13" text-anchor="end" fill="#7890a8">${fmt(v)}</text>`;
  }).join('');
  const bars=data.map((v,i)=>{
    const cx=x0+step*(i+.5),h=v/upper*height,y=y0-h;
    return `<rect x="${cx-bar/2}" y="${y}" width="${bar}" height="${h}" rx="6" fill="${color[i%color.length]}"/><text x="${cx}" y="${Math.max(24,y-10)}" font-size="17" text-anchor="middle" fill="#2e587c" font-weight="900">${fmt(v)}${unit}</text><text x="${cx}" y="${y0+24}" font-size="17" text-anchor="middle" fill="#365b7e" font-weight="850">${escapeHTML(labels[i])}</text>`;
  }).join('');
  return `<svg class="mplsvg" viewBox="0 0 690 290" role="img" aria-label="分類長條圖"><line x1="${x0}" y1="${y0}" x2="${x0+width}" y2="${y0}" stroke="#7892ad" stroke-width="2"/>${grid}${bars}</svg>`;
}
// Apply histogram bin edges as NumPy does: include the right edge in the last bin.
// 按 NumPy 直方圖規則分箱，只有最後一組包含右邊界。
function histogram(data,bins){
  const lo=Math.min(...data),hi=Math.max(...data),step=(hi-lo)/bins;
  const counts=Array(bins).fill(0);
  data.forEach(v=>counts[Math.min(bins-1,Math.floor((v-lo)/step))]++);
  const edges=Array.from({length:bins+1},(_,i)=>lo+step*i);
  return {counts,edges};
}
// Draw adjacent bars because histogram x positions represent continuous intervals.
// 直方圖使用相鄰長條，因為橫軸是連續數值區間。
function mplHistogram(bins){
  const data=rows.filter(r=>r.hours!==null).map(r=>r.hours);
  const {counts,edges}=histogram(data,bins);
  const x0=72,y0=245,width=582,height=172,step=width/bins,max=Math.max(3,...counts);
  const grid=Array.from({length:max+1},(_,k)=>{
    const y=y0-k/max*height;
    return `<line x1="${x0}" y1="${y}" x2="${x0+width}" y2="${y}" stroke="#e3ecf6" stroke-dasharray="4 4"/><text x="${x0-16}" y="${y+5}" text-anchor="end" font-size="13" fill="#7890a8">${k}</text>`;
  }).join('');
  const bars=counts.map((v,i)=>{
    const x=x0+step*i,top=y0-v/max*height,cx=x+step/2;
    return `<rect x="${x+1}" y="${top}" width="${step-2}" height="${y0-top}" fill="${i%2?'#4a7ae2':'#57a49e'}" stroke="white" stroke-width="1"/><text x="${cx}" y="${Math.max(29,top-9)}" text-anchor="middle" font-size="16" fill="#345b79" font-weight="850">${v}</text><text x="${cx}" y="${y0+22}" text-anchor="middle" font-size="12.5" fill="#57738f" font-weight="800">${fmt(edges[i])}～${fmt(edges[i+1])}</text>`;
  }).join('');
  return `<svg class="mplsvg" viewBox="0 0 690 285" role="img" aria-label="依照時數區間分箱的直方圖">${grid}<line x1="${x0}" y1="${y0}" x2="${x0+width}" y2="${y0}" stroke="#829ab4" stroke-width="2"/>${bars}<text x="${x0+width/2}" y="282" font-size="15" text-anchor="middle" fill="#58758d" font-weight="850">準備時數區間（小時）</text></svg>`;
}
// Render pie wedges and their labels from group totals instead of fixed percentages.
// 圓餅圖以分組統計值運算扇形與百分比，不使用寫死的數字。
function mplPieChart(data){
  const colors=['#5277df','#18a69d','#f3a257'],total=sum(data),cx=234,cy=146,r=115;
  let start=-Math.PI/2;
  const sectors=data.map((v,i)=>{
    const angle=v/total*Math.PI*2,end=start+angle,large=angle>Math.PI?1:0;
    const px=x=>cx+r*Math.cos(x),py=x=>cy+r*Math.sin(x);
    const x1=px(start),y1=py(start),x2=px(end),y2=py(end),mid=(start+end)/2;
    const labelX=cx+r*.60*Math.cos(mid),labelY=cy+r*.60*Math.sin(mid);
    const shape=`<path d="M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} Z" fill="${colors[i]}" stroke="white" stroke-width="3"/>`;
    const pct=`<text x="${labelX}" y="${labelY+6}" text-anchor="middle" font-size="18" fill="white" font-weight="900">${(100*v/total).toFixed(1)}%</text>`;
    start=end;
    return shape+pct;
  }).join('');
  const legend=groups.map((g,i)=>{
    const y=92+i*62;
    return `<rect x="424" y="${y-16}" width="17" height="17" rx="4" fill="${colors[i]}"/><text x="451" y="${y}" font-size="17" fill="#365c7a" font-weight="850">${g}　${fmt(data[i])}　(${(data[i]/total*100).toFixed(1)}%)</text>`;
  }).join('');
  return `<svg class="mplsvg" viewBox="0 0 690 290" role="img" aria-label="依照小組資料算出的圓餅圖">${sectors}${legend}<text x="530" y="277" text-anchor="middle" fill="#6d88a1" font-size="15" font-weight="800">合計：${fmt(total)}</text></svg>`;
}

   const a=hours, sel=a.slice(st.start,st.end);return `${values(a,i=>i>=st.start&&i<st.end?'hot':'',`hours[${st.start}:${st.end}] → [${sel.join(', ')}]`)}<div class="equation" style="margin-top:14px">${sel.length} 筆資料被選中；索引 ${st.end} 不包含在內</div>`;
 }
 case 'matrix':return `<div class="matrix">${mat.map((r,i)=>r.map((v,j)=>`<button class="mx ${st.row===i&&st.col===j?'pick':''}" data-cell="${i}-${j}" aria-label="第${i}列第${j}欄數字${v}">${v}</button>`).join('')).join('')}</div><div class="arr-caption">a[${st.row}, ${st.col}] = ${mat[st.row][st.col]}　｜　第 ${st.row+1} 列、第 ${st.col+1} 欄</div>`;
 case 'broadcast':{
   const a=hours.map(x=>x+st.bonus);return `${linebars('ABCDEFGH'.split(''),a,{max:9,unit:'h'})}<div class="legend">原始平均 ${fmt(mean(hours))} 小時 → 調整後平均 ${fmt(mean(a))} 小時　（每筆都加 ${st.bonus}）</div>`;
 }
 case 'pair':{
   const a=[1,2,3],b=[4,5,6],r=st.choice?a.map((x,i)=>x+b[i]):a.concat(b);
   return `<div class="minihint">A = [1, 2, 3]　＋　B = [4, 5, 6]</div>${values(r,()=>st.choice?'hot':'',st.choice?'逐元素相加：結果仍是 3 個元素':'兩組 list 串接：結果有 6 個元素')}<div class="equation" style="margin-top:14px">${st.choice?'[1+4, 2+5, 3+6] → [5, 7, 9]':'[1, 2, 3] + [4, 5, 6] → [1, 2, 3, 4, 5, 6]'}</div>`;
 }
 case 'mask':{
   const sel=hours.filter(x=>x>=st.k),indices=hours.map((v,i)=>v>=st.k?i:-1).filter(x=>x>=0);
   return `${values(hours,i=>indices.includes(i)?'hot':'dim',`hours >= ${st.k} → [${sel.join(', ')}]`)}${linebars('ABCDEFGH'.split(''),hours,{highlight:indices,max:6,unit:'h'})}<div class="legend">保留 ${sel.length}／8 筆　｜　保留值平均 ${fmt(mean(sel))} 小時</div>`;
 }
 case 'stats':{
   const results=[sum(hours),mean(hours),Math.min(...hours),Math.max(...hours)],labels=['總時數','平均每筆時數','最少時數','最多時數'];
   return `${linebars('ABCDEFGH'.split(''),hours,{highlight:st.stat===2?[4]:st.stat===3?[3]:[],max:6,unit:'h'})}<div class="legend">${labels[st.stat]}：${fmt(results[st.stat])} 小時　｜　原始數值共 8 筆</div>`;
 }
 case 'axis':{
   const m=st.axis?mat.map(r=>mean(r)):[0,1,2,3].map(j=>mean(mat.map(r=>r[j])));
   const tr=mat.map((r,i)=>`<div class="arrrow" style="margin:3px 0;gap:6px">${r.map((v,j)=>`<div class="arraycell ${st.axis?'hot':'pick'}" style="padding:8px 0;width:66px;font-size:19px">${v}</div>`).join('')}${st.axis?`<span class="bluepill">${fmt(m[i])}</span>`:''}</div>`).join('');
   return `<div style="display:flex;gap:25px;justify-content:center;align-items:center"><div>${tr}${st.axis?'':`<div class="arrrow" style="gap:6px">${m.map(v=>`<div class="bluepill" style="width:66px;justify-content:center;padding:5px">${fmt(v)}</div>`).join('')}</div>`}</div><div style="font-size:19px;font-weight:850;color:#526e8c;line-height:2">axis = ${st.axis}<div class="statbig" style="font-size:40px">${m.length} 值</div><span class="legend">${st.axis?'各列的平均':'各欄的平均'}</span></div></div>`;
 }
 case 'labnum':{
   const vals=hours.map(x=>x+st.bonus),sel=vals.filter(x=>x>=st.k),chosen=vals.map((v,i)=>v>=st.k?i:-1).filter(x=>x>=0);
   return `${linebars('ABCDEFGH'.split(''),vals,{highlight:chosen,max:10,unit:'h'})}<div class="legend">增加 ${st.bonus} 小時 → 保留 ≥ ${st.k}：${sel.length} 筆　｜　保留平均 ${fmt(mean(sel))} 小時</div>`;
 }
 case 'csv':{
   if(st.choice===0)return `<div style="background:#172f4b;color:#d7eaff;padding:18px 25px;border-radius:15px;font:17px/1.56 Consolas,monospace;white-space:pre">${escapeHTML(csvData(rows))}</div>`;
   return table(rows);
 }
 case 'frame':return `${table(rows,{selected:['id','group','hours','tasks'][st.choice]})}<div class="legend">8 列 × 4 欄　｜　df.shape = (8, 4)</div>`;
 case 'column':{
   const cols=[['id','group'],['group','hours'],['hours','tasks']][st.choice];return `${table(rows,{cols})}<div class="legend">選取欄位 ${cols.map(k=>fields[k]).join('、')}　｜　8 列 × ${cols.length} 欄</div>`;
 }
 case 'filter':{
   const matching=rows.filter(r=>r.tasks>=st.k).map(r=>r.id);return `${table(rows,{highlight:matching,dimOthers:true})}<div class="legend">tasks ≥ ${st.k} 項 → ${matching.length}／8 筆　｜　保留：${matching.join('、')||'無'}</div>`;
 }
 case 'missing':{
   const data=cleanRows(st.mode),avg=mean(data.filter(x=>x.hours!==null).map(x=>x.hours));
   return `${table(data,{missingMode:st.mode===2})}<div class="legend">${['原始資料：F 的時數缺漏','刪除 F：只保留時數完整的紀錄','F 以已知平均 3 小時補入'][st.mode]}　｜　${data.length} 列；有效時數平均 ${fmt(avg)} 小時</div>`;
 }
 case 'describe':{
   const a=rows.filter(r=>r.hours!==null).map(r=>r.hours),v=[a.length,mean(a),median(a),Math.max(...a)][st.stat];
   return `${linebars(['A','B','C','D','E','F','G','H'],rows.map(r=>r.hours??0),{max:6,highlight:[],unit:'h',missing:[5]})}<div class="legend">F 的時數缺漏（畫面長條高度 0 僅代表未顯示，並非實際 0 小時）</div><div class="resultline">${['非缺漏筆數','平均時數','中位數','最大時數'][st.stat]} = ${fmt(v)} ${st.stat===0?'筆':'小時'}</div>`;
 }
 case 'group':{
   const stats=groups.map(g=>{const data=rows.filter(r=>r.group===g);return {g,mean:mean(data.filter(r=>r.hours!==null).map(r=>r.hours)),tasks:sum(data.map(r=>r.tasks)),count:data.length};});
   const current=stats[st.group];
   return `${linebars(groups,stats.map(x=>x.mean),{highlight:[st.group],max:6,unit:'h'})}<div class="legend">${current.g}：${current.count} 筆紀錄，任務總數 ${current.tasks} 項；非缺漏時數平均 ${fmt(current.mean)} 小時</div>`;
 }
  case 'plot':{
    const label=['bar｜比較類別','hist｜看數值區間','pie｜看整體占比'][st.choice];
    const data=st.choice===0?chartGroups('total'):st.choice===1?rows.filter(r=>r.hours!==null).map(r=>r.hours):chartGroups('count');
    const names=st.choice===1?data.map((_,i)=>`第 ${i+1} 筆`):groups;
    const contents=`<table class="mplsmalltable"><tr>${names.map((g,i)=>`<td><span class="name">${escapeHTML(g)}</span>${fmt(data[i])}</td>`).join('')}</tr></table>`;
    return `<div class="flowline" style="gap:11px"><div class="flowcard on" style="min-height:92px;padding:12px 8px"><div class="name" style="margin:4px 0">activity.csv</div><div class="sm">8 筆紀錄</div></div><div class="flowarrow">→</div><div class="flowcard on" style="min-height:92px;padding:12px 8px"><div class="name" style="margin:4px 0">Pandas</div><div class="sm">讀取與整理資料</div></div><div class="flowarrow">→</div><div class="flowcard on" style="min-height:92px;padding:12px 8px"><div class="name" style="margin:4px 0">Matplotlib</div><div class="sm">${label}</div></div></div><div class="minihint" style="margin-top:19px">目前準備繪圖的 data（來自同一份 df）</div>${contents}<div class="mplfoot">${['按小組加總 tasks','取出非缺漏 hours','按小組計算紀錄筆數'][st.choice]}</div>`;
  }
  case 'mplbar':{
    const kind=['total','average','count'][st.choice],data=chartGroups(kind),unit=[' 項',' 小時',' 筆'][st.choice];
    return `${mplBarChart(data,groups,{unit,max:[16,6,4][st.choice]})}<div class="mplfoot">${['各組任務數（sum）','各組平均時數（mean，略過缺漏）','各組紀錄筆數（size）'][st.choice]}　｜　資料來源：activity.csv</div>`;
  }
  case 'mplhist':{
    const data=rows.filter(r=>r.hours!==null).map(r=>r.hours),{counts}=histogram(data,st.bins);
    return `${mplHistogram(st.bins)}<div class="mplfoot">有效時數 7 筆／原始紀錄 8 筆　｜　各區間筆數：[${counts.join('、')}]　｜　F 缺漏不計入</div>`;
  }
  case 'mplpie':{
    const data=chartGroups(st.choice?'total':'count');
    return `${mplPieChart(data)}<div class="mplfoot">${st.choice?'分母＝全組任務總數 '+sum(data)+' 項':'分母＝全部 '+sum(data)+' 筆活動紀錄'}；三個部分合計為 100%</div>`;
  }
 case 'challenge':{
   const data=cleanRows(st.fill?2:1).filter(r=>r.tasks>=st.k),hoursVals=data.map(r=>r.hours);
   return `${table(data)}<div class="legend">${st.fill?'先以平均補值':'先刪除缺漏'} → tasks ≥ ${st.k}　｜　留下 ${data.length} 筆；平均時數 ${fmt(mean(hoursVals))} 小時</div>`;
 }
 case 'quiz':{
   const q=s.questions[st.q];return `<div class="quizquestion">Q${st.q+1}　${q.q}</div><div class="quizopts">${q.opts.map((o,i)=>`<button class="quizchoice ${st.answered&&i===q.ok?'right':st.wrong&&st.last===i?'wrong':''}" data-answer="${i}" ${st.answered?'disabled':''}>${String.fromCharCode(65+i)}. ${escapeHTML(o)}</button>`).join('')}</div><div class="quizstatus">${st.answered?'已答對。完整解析顯示在右側。':st.wrong?'尚未答對，依右側提示再試一次。':'點選一個答案，檢查自己的理解。'}</div>`;
 }
 }
 return '';
}
function explanation(s,st){
  if(s.kind==='quiz'){
    if(st.answered)return `<div class="smallhead">✓ 解題解析</div><div class="quizexplain">${s.questions[st.q].why}</div>`;
    if(st.wrong)return `<div class="smallhead">再試一次</div><div class="quizhint">${s.questions[st.q].hint}</div>`;
    return `<div class="smallhead">作答方式</div><p class="note">先根據圖形或前面學到的規則思考，不需要猜選項字母。答錯後會得到一個提示。</p>`;
  }
  const dyn={
    types:['int 可用於整數計算，例如任務數。','float 能表示含小數的時數或平均值。','str 儲存文字，例如「宣傳」。','bool 是 True 或 False，常用於條件判斷。'][st.choice],
    list:`[ ] 是 list 的資料表示法；索引 ${st.index} 對應 ${hours[st.index]} 小時，從 0 開始計數。`,
    dict:st.mode?'先從外層找 info，裡面仍是 { } 所組成的 dict，再用 [ ] 取得 hours 或 tasks。':'dict 用 { } 包住 key: value，每個欄位都可經由 data["key"] 取出。',
    condition:`${st.h} >= 3 → ${st.h>=3?'True，達標':'False，尚未達標'}。`,
    loop:`目前累積 ${sum([3,5,4,8].slice(0,st.step))} 項任務；迴圈共有 4 次讀取。`,
    structure:['[ ] 表示 list；用數字索引取得對應位置的元素。','{ } 表示 dict；用 key 取得對應的 value。','內層可以再放 dict 或 list；依序使用 [ ] 取出每一層需要的值。'][st.choice],
    intro2:st.choice?'NumPy array 的 * 對每個數值執行乘法，這是逐元素運算。':'Python list 的 * 會重複整組元素，並不是逐個數字相乘。',
    slice:`目前切出 ${hours.slice(st.start,st.end).length} 筆，注意 stop 不包含。`,
    matrix:`目前位置為 a[${st.row}, ${st.col}]，數值 ${mat[st.row][st.col]}。`,
    broadcast:`每筆加 ${st.bonus} 小時，平均也由 3 增加到 ${3+st.bonus} 小時。`,
    mask:`保留 ${hours.filter(v=>v>=st.k).length} 筆符合條件的紀錄。`,
    pair:st.choice?'逐元素運算需要陣列長度相容；這裡兩個陣列皆有 3 筆。':'list 的 + 把元素接在後面，不會逐項相加。',
    axis:st.axis?'axis=1：對每一列的四個值取平均，最後有 3 個結果。':'axis=0：對每一欄的三個值取平均，最後有 4 個結果。',
    labnum:`條件與計算均使用同一份更新後的陣列；若無符合值，平均顯示「無資料」。`,
    filter:`任務數 ≥ ${st.k}，共有 ${rows.filter(x=>x.tasks>=st.k).length} 筆符合。`,
    missing:['缺漏表示不知道，不等於 0。','dropna 會移除缺漏所在列，樣本數變少。','fillna 用 3 補入 F，保留全部 8 筆，但可能影響分布。'][st.mode],
     plot:['先按小組加總 tasks，再交給 Matplotlib 畫 bar。','hist 要先取出準備時數，並略過缺漏值。','pie 要先按小組計算筆數，才有各部分的占比。'][st.choice],
     mplbar:['bar 的每根長條都代表一個小組的任務總數。','先用 Pandas 依組算平均；缺漏時數不參與平均。','size() 計算每組幾筆紀錄，不是加總時數。'][st.choice]+' 若中文標籤顯示異常，需在執行環境設定可用中文字型。',
     mplhist:`bins=${st.bins}，把 1～5 小時分成 ${st.bins} 個連續區間；改變分箱數不會修改原始時數。`,
     mplpie:st.choice?'分母是三組全部任務數之和；每組任務多，扇形就比較大。':'分母是全部 8 筆紀錄；各組占比分別依 3、3、2 筆換算。',
    challenge:`清理方法和任務門檻，都應在報告中清楚註明。`
  }[s.kind];
  return `<div class="smallhead">觀察重點</div><p class="note">${dyn||s.observe}</p>`;
}
function codeFor(s,st){
 switch(s.kind){
 case 'operation':return `hours = ${st.h}\ntasks = hours * 2`;
 case 'list':return `hours = [2, 4, 3, 5, 1, 3, 4, 2]\nhours[${st.index}]`;
 case 'dict':{
   if(st.mode){const k=['hours','tasks'][st.choice%2];return `data = {\n    "id": "A", "group": "宣傳",\n    "info": {"hours": 2, "tasks": 3}\n}\ndata["info"]["${k}"]`;}
   const k=['id','group','hours','tasks'][st.choice];return `data = {\n    "id": "A", "group": "宣傳",\n    "hours": 2, "tasks": 3\n}\ndata["${k}"]`;
 }
 case 'condition':return `hours = ${st.h}\nif hours >= 3:\n    status = "達標"\nelse:\n    status = "未達標"`;
 case 'function':return `def get_tasks(hours):\n    return hours * 2\n\nget_tasks(${st.h})`;
 case 'structure':return [
   'hours = [2, 4, 3]\nhours[0]',
   'data = {"name": "Amy", "hours": 2}\ndata["hours"]',
   'data = {\n    "name": "Amy",\n    "info": {"hours": 2,\n             "days": ["Mon", "Wed"]}\n}\ndata["info"]["days"][0]'
 ][st.choice];
 case 'intro2':return st.choice?'import numpy as np\na = np.array([2, 4, 3])\na * 2':'a = [2, 4, 3]\na * 2';
 case 'pair':return st.choice?'np.array([1, 2, 3]) + np.array([4, 5, 6])':'[1, 2, 3] + [4, 5, 6]';
 case 'stats':return `np.${['sum','mean','min','max'][st.stat]}(hours)`;
 case 'column':return `df[[${[['id','group'],['group','hours'],['hours','tasks']][st.choice].map(x=>'"'+x+'"').join(', ')}]]`;
 case 'missing':return st.mode===1?'df.dropna(subset=["hours"])':st.mode===2?'df["hours"].fillna(df["hours"].mean())':'df["hours"].isna()';
 case 'plot':return 'import pandas as pd\ndf = pd.read_csv("activity.csv")\n'+[
    'g = df.groupby("group", sort=False)\ndata = g["tasks"].sum()',
    'data = df["hours"].dropna()',
    'g = df.groupby("group", sort=False)\ndata = g.size()'
  ][st.choice];
  case 'mplbar':return 'import pandas as pd\nimport matplotlib.pyplot as plt\ndf = pd.read_csv("activity.csv")\ng = df.groupby("group", sort=False)\n'+[
    'data = g["tasks"].sum()',
    'data = g["hours"].mean()',
    'data = g.size()'
  ][st.choice]+'\nplt.bar(data.index, data)\nplt.ylabel("'+['Tasks','Hours','Records'][st.choice]+'")\nplt.show()';
  case 'mplhist':return `import pandas as pd\nimport matplotlib.pyplot as plt\ndf = pd.read_csv("activity.csv")\ndata = df["hours"].dropna()\nplt.hist(data, bins=${st.bins}, edgecolor="white")\nplt.xlabel("Hours")\nplt.ylabel("Count")\nplt.show()`;
  case 'mplpie':return 'import pandas as pd\nimport matplotlib.pyplot as plt\ndf = pd.read_csv("activity.csv")\ng = df.groupby("group", sort=False)\n'+(st.choice?
    'data = g["tasks"].sum()':
    'data = g.size()')+'\nplt.pie(data, autopct="%1.1f%%")\nplt.legend(data.index)\nplt.show()';
 case 'challenge':return st.fill?'data = df.fillna({"hours": df["hours"].mean()})':'data = df.dropna(subset=["hours"])';
 default:return s.code;
 }
}
function highlightPython(code){
 const keys=new Set(['if','else','elif','for','in','def','return','import','as','and','or','not','from']);
 const calls=new Set(['type','print','len','range','sum','min','max','float','int','str','bool']);
 const parts=code.match(/(?:"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|\b\d+(?:\.\d+)?\b|\b[A-Za-z_]\w*\b|==|!=|<=|>=|\+=|-=|\*\*|\/\/|[+\-*\/%=<>]|\s+|.)/g)||[];
 let last='';
 return parts.map((t,i)=>{
   let cls='';
   if(/^['"]/.test(t))cls='tok-str';
   else if(/^\d/.test(t))cls='tok-num';
   else if(keys.has(t))cls='tok-key';
   else if(['True','False','None'].includes(t))cls='tok-bool';
   else if(['np','pd'].includes(t))cls='tok-module';
   else if(calls.has(t)||last==='.'||parts.slice(i+1).find(x=>x.trim())==='(')cls='tok-call';
   else if(/^[A-Za-z_]\w*$/.test(t))cls='tok-var';
   else if(/^[+\-*\/%=<>!]+$/.test(t))cls='tok-op';
   if(t.trim())last=t;
   return cls?`<span class="${cls}">${escapeHTML(t)}</span>`:escapeHTML(t);
 }).join('');
}
function editor(code){
 const lines=code.split('\n').map((line,i)=>`<span class="code-line"><span class="line-no">${i+1}</span>${highlightPython(line)}</span>`).join('');
 return `<div class="codewrap"><div class="codehead">Python · 範例程式碼</div><pre><code>${lines}</code></pre></div>`;
}
function aside(s,st){
  if(s.kind==='quiz')return `<div class="smallhead">快速檢核</div><div class="lead">${s.lead}</div>${explanation(s,st)}<div class="think">${s.think}</div>`;
  const code=codeFor(s,st);return `<div class="smallhead">核心概念</div><div class="lead">${s.lead}</div>${explanation(s,st)}${code?editor(code):''}<div class="think">思考一下｜${s.think}</div>`;
}
function resize(){const scale=Math.min(innerWidth/1280,innerHeight/720);root.style.transform=`scale(${scale})`;root.style.left=`${(innerWidth-1280*scale)/2}px`;root.style.top=`${(innerHeight-720*scale)/2}px`;}
function slideTo(i){page=Math.max(0,Math.min(slides.length-1,i));overlay='';render();}
function render(){
 const s=slides[page],st=ss(),section=s.section,local=slides.slice(0,page+1).filter(x=>x.section===section).length;
 root.innerHTML=`<div class="slidehead"><div class="meta"><div class="brand">${avatar()}<span>課程系列｜Python 與資料分析</span><span class="subbrand">教學主題｜Python 數據處理與程式複習</span></div><span class="chip">第 ${section} 節 ／ 3 節</span></div><div class="titleline"><h1>${s.title}</h1><span class="topicnum">${['PYTHON 基礎','NUMPY 陣列','PANDAS 與 MATPLOTLIB'][section-1]}　·　${String(local).padStart(2,'0')}</span></div></div><div class="content"><section class="mainpanel" aria-label="互動教學區"><div class="panelhead"><span class="panellabel">${s.kind==='quiz'?'快速檢核｜3 題':'觀察與操作｜互動示範'}</span><span class="panelhint">${s.kind==='quiz'?'答錯只有提示，答對顯示解析':'改變輸入，看看圖形如何跟著變'}</span></div><div id="viz" class="${['list','mask','describe'].includes(s.kind)?'compact-chart':''} ${s.kind==='mask'?'mask-layout':''} ${['frame','column','filter','missing','challenge','csv'].includes(s.kind)?'compact-table':''}"></div><div id="controls"></div></section><aside class="sidepanel ${["plot","mplbar","mplhist","mplpie"].includes(s.kind)?"chartaside":""}" id="aside"></aside></div><footer class="foot"><div class="footerMeta"><div class="footnotice">← / → 逐頁移動　·　G 投影片總覽　·　H 操作說明</div></div><div class="progress">${slides.map((x,i)=>`<span class="pseg ${i<page?'done':i===page?'now':''}" title="${i+1}"></span>`).join('')}</div><div class="nav"><span class="numlabel">${page+1} / ${slides.length}</span><button data-nav="-1" ${page===0?'disabled':''}>上一頁</button><button class="next" data-nav="1" ${page===slides.length-1?'disabled':''}>下一頁</button></div></footer>`;
 renderDynamic(true);if(overlay)showOverlay();
}
function renderDynamic(rebuildControls=false){const s=slides[page],st=ss();document.getElementById('viz').innerHTML=renderVisual(s,st);document.getElementById('aside').innerHTML=aside(s,st);if(rebuildControls)document.getElementById('controls').innerHTML=controls(s,st);}
function showOverlay(){
 let body=overlay==='overview'?`<h2>投影片總覽｜共 ${slides.length} 張</h2><div class="overview">${slides.map((s,i)=>`<button class="${page===i?'active':''}" data-goto="${i}">${String(i+1).padStart(2,'0')}｜${s.title}</button>`).join('')}</div>`:`<h2>投影片操作說明</h2><div class="helptext">← / →：切換上一張／下一張投影片（一次只換一頁）<br>滑桿與按鈕：操作本頁的資料、圖形與模式<br>G：投影片總覽　H：開啟操作說明　F：切換全螢幕<br>Esc：關閉這個視窗<br><small>這份投影片可離線操作；實際 Python 程式仍需在 VS Code 或 Google Colab 執行。</small></div>`;
 root.insertAdjacentHTML('beforeend',`<div class="overveil"><div class="overlay"><button class="closeoverlay" data-action="closeoverlay">關閉 ×</button>${body}</div></div>`);
}
// Dispatch slide-specific interactions to the same state model.
// 將投影片上的各種操作交由同一份狀態進行管理。
root.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.hasAttribute('data-nav')){slideTo(page+Number(b.dataset.nav));return;}
 if(b.hasAttribute('data-goto')){slideTo(+b.dataset.goto);return;}
 let st=ss();
 for(const key of ['choice','stat','mode','axis','group','fill'])if(b.hasAttribute('data-'+key)){if(slides[page].kind==='dict'&&key==='mode')st.choice=0;st[key]=Number(b.dataset[key]);renderDynamic(true);return;}
 if(b.hasAttribute('data-cell')){[st.row,st.col]=b.dataset.cell.split('-').map(Number);renderDynamic(false);return;}
 if(b.hasAttribute('data-answer')){
  const q=slides[page].questions[st.q],answer=Number(b.dataset.answer);st.last=answer;
  if(answer===q.ok){st.answered=true;st.wrong=false;}else{st.answered=false;st.wrong=true;}
  renderDynamic(false);return;
 }
 if(b.hasAttribute('data-action')){
  switch(b.dataset.action){
  case 'resetstep':st.step=0;break;case 'nextstep':st.step=Math.min(4,st.step+1);break;case 'allstep':st.step=4;break;
  case 'nextq':st.q=Math.min(2,st.q+1);st.answered=false;st.wrong=false;st.last=-1;break;
  case 'prevq':st.q=Math.max(0,st.q-1);st.answered=false;st.wrong=false;st.last=-1;break;
  case 'csv':downloadFile('activity.csv',csvData(rows));return;
  case 'cleaned':{const data=cleanRows(st.fill?2:1).filter(r=>r.tasks>=st.k);downloadFile('activity_cleaned.csv',csvData(data));return;}
  case 'closeoverlay':overlay='';render();return;
  }
  renderDynamic(true);
 }
});
// Keep the native range control mounted so dragging remains smooth.
// 拖曳滑桿時不重新建立輸入元件，避免拖曳中斷。
root.addEventListener('input',e=>{
 const r=e.target;if(!r.matches('input[data-range]'))return;
 const key=r.dataset.range;ss()[key]=Number(r.value);const unit=(key==='index'||key==='start'||key==='end')?'':key==='bins'?' 組':key==='k'?(slides[page].kind==='filter'||slides[page].kind==='challenge'?' 項':' 小時'):' 小時';
 document.getElementById('out-'+key).textContent=r.value+unit;renderDynamic(false);
});
// Protect keyboard interactions inside focused editable controls.
// 焦點位於輸入控制元件時，保留方向鍵的原始操作。
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&overlay){overlay='';render();return;}
 if(overlay)return;
 if(/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement?.tagName||''))return;
 if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();slideTo(page+1);}
 else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();slideTo(page-1);}
 else if(e.key.toLowerCase()==='g'){overlay='overview';showOverlay();}
 else if(e.key.toLowerCase()==='h'||e.key==='?'){overlay='help';showOverlay();}
 else if(e.key.toLowerCase()==='f'){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.();}
});
window.addEventListener('resize',resize);
resize();render();
</script>
</body>
</html>
