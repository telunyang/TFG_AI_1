</style></head><body><div id="deck" role="application" aria-label="分類模型與評估互動式投影片"></div><script>const slides=[{"section":1,"kind":"cover","title":"一朵鳶尾花，怎麼判斷它是哪一類？","lead":"這次不預測分數，而是利用花瓣的測量資料判斷鳶尾花的種類。","observe":"切換三個學習階段：認識資料、學習分類、檢查結果。","think":"外觀相近的兩朵花，模型有可能判成不同種類嗎？","code":""},{"section":1,"kind":"regclass","title":"分類和回歸，預測的答案哪裡不同？","lead":"回歸輸出連續數值；分類輸出類別，例如「這是哪一種花」。","observe":"切換預測目標，比較數值與類別的輸出方式。","think":"預測花瓣長度 4.6 公分和預測花的種類，分別是哪一種任務？","code":""},{"section":1,"kind":"iris","title":"Iris 資料集：150 朵花、3 種類別","lead":"Iris CSV 已有 150 筆測量資料與三種 species 標籤；這一課直接讀取檔案，不需 load_iris()。","observe":"課前先上傳 iris_classification.csv，再用 Pandas 讀取；選擇不同花種，觀察各 50 筆。","think":"如果 CSV 不在 Colab 執行環境，read_csv() 會發生什麼？","code":"import pandas as pd\ndf = pd.read_csv(\"iris_classification.csv\")\nprint(df[\"species\"].value_counts())"},{"section":1,"kind":"features","title":"一朵花有四個測量特徵","lead":"原始 Iris 資料有花萼長、花萼寬、花瓣長、花瓣寬，單位都是公分。","observe":"切換四個特徵，觀察表格欄位與範例測量值。","think":"為什麼不能只用「第幾筆資料」當成可靠特徵？","code":"print(df[[\"sepal_length\", \"sepal_width\",\n          \"petal_length\", \"petal_width\"]].head())"},{"section":1,"kind":"columns","title":"樣本、特徵、標籤：從表格辨認","lead":"CSV 每一列是一朵花；花瓣長、寬是 X，species 的種類文字就是 y，不必編成 0／1／2。","observe":"切換「樣本、X、y」，對應表格會高亮資料位置。","think":"分類時，模型能事先從 X 看到待預測花朵真正的 y 嗎？","code":"X = df[[\"petal_length\", \"petal_width\"]].to_numpy()\ny = df[\"species\"].to_numpy()"},{"section":1,"kind":"scatter","title":"用散佈圖找三種花的分布","lead":"將花瓣長度放在橫軸、花瓣寬度放在縱軸，每個點就是一朵花。","observe":"切換類別篩選，觀察 Setosa 與其他兩類的距離，以及後兩類的重疊。","think":"同一張圖能否保證三種花完全不重疊？","code":""},{"section":1,"kind":"probs","title":"模型先給三種可能性，再決定類別","lead":"分類模型可以輸出每一類的預測機率，通常選機率最高的類別作為預測。","observe":"選取不同測試花朵，三條機率長條與最終預測會一起更新。","think":"0.7 的預測機率，是否表示模型一定正確？","code":"prob = model.predict_proba(X_test)"},{"section":1,"kind":"methods","title":"兩種分類想法：分數比較與問答判斷","lead":"邏輯斯迴歸用學到的權重計算各類別機率；決策樹透過一連串條件判斷分類。","observe":"切換模型，觀察同一筆花瓣資料如何經過不同流程得到答案。","think":"同一筆資料交給不同模型，有可能得到不同結果嗎？","code":""},{"section":1,"kind":"workflow","title":"從訓練資料到新花朵的預測","lead":"標準流程是先切資料，再用訓練集 fit、測試集 predict，最後核對真實種類。","observe":"依序點選切分、訓練、預測、評估，觀察資料如何流動。","think":"若把測試集答案先拿來訓練，會影響評估的公平性嗎？","code":"model.fit(X_train, y_train)\npred = model.predict(X_test)"},{"section":1,"kind":"quiz","title":"第一節快速檢核","lead":"確認分類任務、樣本與特徵，以及 Iris 三種標籤的角色。","observe":"直接作答；答錯只給提示，答對才顯示完整解析。","think":"完成後，下一節會用 scikit-learn 實作模型。","code":"","questions":[{"q":"以下哪個是「分類」任務？","opts":["預測花瓣長度（公分）","預測花朵是哪一種 Iris","預測明天溫度","預測跑步速度"],"ok":1,"hint":"分類輸出的是類別名稱，而不是連續數值。","why":"分類預測一個離散類別，例如 Setosa、Versicolor 或 Virginica；長度、溫度、速度屬於數值預測。"},{"q":"Iris 資料中的「花瓣寬度」在本次任務中是什麼？","opts":["模型輸入特徵 X","真實種類標籤 y","模型準確率","測試集的答案數量"],"ok":0,"hint":"想想模型需要看到什麼資訊，才知道該預測哪一種花。","why":"花瓣寬度是描述每朵花的測量值，屬於特徵 X；真正的種類才是標籤 y。"},{"q":"某筆花的三類預測機率是 0.1、0.8、0.1，模型通常選哪一類？","opts":["第 1 類","第 2 類","第 3 類","三類都選"],"ok":1,"hint":"比較三個機率，哪個最大？","why":"分類器通常以最大機率對應的類別作為 predict 結果；0.8 是三者之中最高的。"}]},{"section":2,"kind":"start2","title":"第二節：讓模型分類沒有看過的花","lead":"這一節實際切分 Iris 資料、訓練邏輯斯迴歸，再核對模型預測。","observe":"切換「訓練集／測試集」，看兩批資料各有多少筆。","think":"怎樣才能評估模型遇到新花朵時的表現？","code":"from sklearn.model_selection import (\n    train_test_split\n)"},{"section":2,"kind":"split","title":"訓練集與測試集：維持三類的比例","lead":"這裡把 150 筆資料分成 105 筆訓練與 45 筆測試；每一種類在測試集恰好有 15 筆。","observe":"切換全體／訓練／測試，查看三種花的筆數與散點標記。","think":"為什麼分類資料切分時，會希望每類都有代表性？","code":"X_train, X_test, y_train, y_test = train_test_split(\n    X, y, test_size=0.3,\n    random_state=4, stratify=y\n)"},{"section":2,"kind":"trainlog","title":"LogisticRegression：fit 後才能 predict","lead":"用花瓣長與寬度，訓練 LogisticRegression 分類模型。","observe":"選擇訓練前或訓練後，觀察資料點與模型的決策區域。","think":"三種類別的分類器，也能稱為邏輯斯迴歸嗎？","code":"from sklearn.linear_model import (\n    LogisticRegression\n)\nmodel = LogisticRegression(\n    max_iter=1000\n)\nmodel.fit(X_train, y_train)"},{"section":2,"kind":"probbar","title":"predict_proba：三種花各有多大可能？","lead":"三類預測機率加總為 1；它們是模型對輸入的估計，不是真實世界的保證。","observe":"選擇不同測試花朵，直接比較三條預測機率長條。","think":"機率最高的類別，就代表一定分類正確嗎？","code":"prob = model.predict_proba(X_test)"},{"section":2,"kind":"regions","title":"決策區域：讓分類邊界看得見","lead":"平面上的每個位置都有模型預測類別；不同底色是不同預測結果，交界處是決策邊界。","observe":"切換訓練點、測試點、所有資料，保持同一組分類邊界。","think":"若兩類花重疊，邊界附近的判斷會比較難嗎？","code":""},{"section":2,"kind":"predict","title":"predict：逐筆比對預測與真實標籤","lead":"測試資料只有特徵進入模型；真實 y_test 保留用來判斷預測是否正確。","observe":"依序選取測試樣本，查看實際類別、模型預測與機率。","think":"一筆判錯就代表模型完全沒有學到分類規律嗎？","code":"pred = model.predict(X_test)"},{"section":2,"kind":"accuracy","title":"Accuracy：45 筆測試花朵，答對幾筆？","lead":"準確率（Accuracy）＝正確分類筆數 ÷ 全部測試筆數；先看分子分母，再看百分比。","observe":"切換正確／錯誤樣本，計算這份測試集的準確率。","think":"如果一個類別非常少，只看 Accuracy 可能會忽略什麼？","code":"from sklearn.metrics import accuracy_score\nacc = accuracy_score(y_test, pred)"},{"section":2,"kind":"confusion","title":"混淆矩陣：哪一類被誤判成哪一類？","lead":"混淆矩陣（Confusion Matrix）用「真實類別」當列、「預測類別」當欄，對角線是正確分類。","observe":"點選矩陣任一格，看對應樣本與這個數字的意義。","think":"如果真實是 Versicolor、預測成 Virginica，應落在哪一格？","code":"from sklearn.metrics import (\n    confusion_matrix\n)\ncm = confusion_matrix(y_test, pred)"},{"section":2,"kind":"readcm","title":"從矩陣回推正確與錯誤的數量","lead":"三個對角線數值加總是答對數；非對角線代表不同的誤判方向。","observe":"選擇「對角線、非對角線、全部」，觀察正確與錯誤如何組成 Accuracy。","think":"只知道錯了 1 筆，是否知道它錯成哪一種類？","code":""},{"section":2,"kind":"quiz","title":"第二節快速檢核","lead":"確認 fit／predict、準確率與混淆矩陣的讀法。","observe":"答錯只提示，答對顯示完整理由。","think":"下一節將以決策樹做比較，並調整樹的深度。","code":"","questions":[{"q":"測試集共有 45 筆，模型正確分類 44 筆，Accuracy 約為多少？","opts":["44%","50%","97.8%","100%"],"ok":2,"hint":"用正確筆數除以總筆數，再乘 100%。","why":"Accuracy=44/45≈0.9778，也就是約 97.8%；它只代表這份測試集的整體正確比例。"},{"q":"混淆矩陣中，哪一種位置代表模型分類正確？","opts":["全部第 1 欄","主對角線","全部最後一列","非對角線"],"ok":1,"hint":"想想「真實種類」與「預測種類」何時相同。","why":"當真實類別與預測類別相同，所在格就在主對角線；其他格代表誤判。"},{"q":"訓練完成後，想知道 45 筆測試花朵的預測類別，應使用？","opts":["model.predict(X_test)","model.fit(X_test, y_test)","model.predict(y_test)","model.fit(y_test)"],"ok":0,"hint":"fit 是學規律，predict 是用已學規律做推測。","why":"使用 model.predict(X_test) 產生預測，再與保留的 y_test 比較；不應重新用測試答案 fit。"}]},{"section":3,"kind":"start3","title":"第三節：決策樹和邏輯斯迴歸有何不同？","lead":"同一批訓練／測試資料可以訓練不同分類模型，再比較效果。","observe":"切換 LogisticRegression 與 DecisionTree，觀察對相同花瓣測量值的判斷。","think":"兩個模型的 Accuracy 相同，就代表它們判斷方式完全相同嗎？","code":""},{"section":3,"kind":"treepath","title":"決策樹：像問問題一樣逐層分類","lead":"根節點先問一個條件，再沿分支走到葉節點，葉節點給出預測類別。","observe":"改變測試花朵，觀看「花瓣寬度 ≤ 0.8？」等判斷路徑。","think":"如果花瓣寬度是 0.3 公分，第一個條件會走哪一邊？","code":"from sklearn.tree import (\n    DecisionTreeClassifier\n)\nmodel = DecisionTreeClassifier(\n    max_depth=2, random_state=0\n)\nmodel.fit(X_train, y_train)"},{"section":3,"kind":"depth","title":"樹的深度：規則越多，就一定越準嗎？","lead":"max_depth 控制樹可以長多深；更深的樹可能更符合訓練資料，也可能對新資料表現較差。","observe":"切換樹深 1、2、3、4、5，決策區域與訓練／測試 Accuracy 會同步更新。","think":"在這份資料中，測試集表現最高的是哪個深度？","code":"model = DecisionTreeClassifier(max_depth=3, random_state=0)\nmodel.fit(X_train, y_train)"},{"section":3,"kind":"fitcurve","title":"欠擬合與過度擬合，要看新資料的結果","lead":"模型太簡單可能抓不住規律；過於複雜也可能學到訓練資料的細節。","observe":"用同一份資料比較三種深度的決策區域與訓練／測試 Accuracy。","think":"如果訓練準確率上升、測試準確率下降，代表什麼警訊？","code":""},{"section":3,"kind":"compare","title":"邏輯斯迴歸 vs 決策樹：公平比較","lead":"固定相同的 Iris 資料、相同的訓練／測試切分，以及相同的 Accuracy 指標。","observe":"切換 LogisticRegression、深度 3 決策樹、深度 5 決策樹，比較決策區與表現。","think":"不同模型得到一樣的 Accuracy，是否必然做出了相同的所有預測？","code":""},{"section":3,"kind":"cmcompare","title":"兩個模型的混淆矩陣如何不同？","lead":"不只比較總準確率，也要看哪一類花比較容易誤判。","observe":"選擇不同模型，混淆矩陣和對應的錯誤樣本一起更新。","think":"即使 Accuracy 一樣，錯誤發生在哪一類，也可能不同。","code":""},{"section":3,"kind":"pr","title":"補充：Precision 與 Recall 關心不同的錯誤","lead":"先指定哪一類是「正類」。Precision 看被判成這類的有多少是真的；Recall 看這類真實樣本找回多少。","observe":"選擇三個類別，觀察該類的 TP、FP、FN，以及 Precision 與 Recall。","think":"若最怕漏掉某一類，通常需要特別留意哪一個指標？","code":""},{"section":3,"kind":"newflower","title":"試試看：新花朵的長度與寬度改變時？","lead":"你可以自行設定一朵新花的花瓣長、花瓣寬，再比較兩個模型的預測。","observe":"拖曳兩個滑桿，觀察新點、分類區域、機率與決策樹路徑。","think":"位在兩類邊界附近的花，是否比遠離邊界的花更難判斷？","code":"new = [[4.8, 1.5]]\nmodel.predict(new)"},{"section":3,"kind":"challenge","title":"完成一次分類專題：資料→模型→評估","lead":"把一週所學串起來：挑特徵、切資料、fit、predict、看 Accuracy 和混淆矩陣。","observe":"選擇模型設定、查看預測錯誤與測試指標，練習解釋結果與限制。","think":"分享成果時要 function predict(key,x,y){
 const m=raw.models[key];if(key==='log'){
  let sc=m.coef.map((r,i)=>m.intercept[i]+r[0]*x+r[1]*y);return sc.indexOf(Math.max(...sc));
 }
 let node=0;while(m.feature[node]>=0){const f=m.feature[node];node=(f===0?x:y)<=m.threshold[node]?m.left[node]:m.right[node];}
 return m.value[node].indexOf(Math.max(...m.value[node]));
}
function probs(x,y){const m=raw.models.log,z=m.coef.map((r,i)=>m.intercept[i]+r[0]*x+r[1]*y),mx=Math.max(...z);const e=z.map(v=>Math.exp(v-mx)),sum=e.reduce((a,b)=>a+b,0);return e.map(v=>v/sum);}
function report(key='log',part='test'){
 let list=part==='train'?raw.train:raw.test,cm=Array.from({length:3},()=>[0,0,0]);
 for(const id of list){const r=sample[id];cm[r.c][predict(key,r.x,r.y)]++;}
 let good=cm.reduce((s,row,i)=>s+row[i],0);return {cm,good,total:list.length,acc:good/list.length,bad:list.length-good};
}

const rx=x=>65+(x-.6)/6.6*555,ry=y=>240-y/2.7*218;
const regionCache={};
function region(key){
 if(regionCache[key])return regionCache[key];
 const parts=[],rows=36,cols=76,dx=555/cols,dy=218/rows;
 for(let j=0;j<rows;j++){
  const y=2.7-(j+.5)/rows*2.7;let start=0,prev=null;
  for(let k=0;k<=cols;k++){
   const type=k===cols?-1:predict(key,.6+(k+.5)/cols*6.6,y);
   if(prev!==null&&type!==prev){parts.push(`<rect x="${(65+start*dx).toFixed(1)}" y="${(22+j*dy).toFixed(1)}" width="${((k-start)*dx+.1).toFixed(1)}" height="${(dy+.1).toFixed(1)}" fill="${soft[prev]}"/>`);start=k;}
   if(prev===null)start=k;prev=type;
  }
 }
 regionCache[key]=parts.join('');return regionCache[key];
}
function scatter({key='',filter=0,selected=-1,wrong=false,compact=false,onlyTest=false,focus=-1}={}){
 const which=filter===1?raw.train:filter===2?raw.test:sample.map(x=>x.id);
 let body=`<svg class="${compact?'smallscatter':'plotSvg'}" viewBox="0 0 685 282" role="img" aria-label="花瓣長度與寬度散佈圖">`;
 body+=`<rect x="65" y="22" width="555" height="218" rx="4" fill="#fafdff"/>`;
 if(key)body+=region(key);
 for(let y=0;y<=2.5;y+=.5){const py=ry(y);body+=`<line x1="65" y1="${py}" x2="620" y2="${py}" stroke="#e4ebf5"/><text x="57" y="${py+4}" text-anchor="end" fill="#64819c" font-size="12">${y.toFixed(1)}</text>`;}
 for(let x=1;x<=7;x++){const px=rx(x);body+=`<line x1="${px}" y1="22" x2="${px}" y2="240" stroke="#eaf0f7"/><text x="${px}" y="257" text-anchor="middle" fill="#64819c" font-size="12">${x}</text>`;}
 body+=`<text x="68" y="13" font-size="12" fill="#557590" font-weight="750">花瓣寬度（公分）</text><text x="350" y="277" text-anchor="middle" font-size="12" fill="#557590" font-weight="750">花瓣長度（公分）</text>`;
 for(const id of which){const r=sample[id];if(wrong&&(!testSet.has(id)||predict(key||'log',r.x,r.y)===r.c))continue;
  const alpha=focus>=0&&r.c!==focus?.13:onlyTest&&!testSet.has(id)?.16:1;
  const cx=rx(r.x),cy=ry(r.y),sel=id===selected;
  const stroke=sel?'#203f68':r.train?'#ffffff':'#273e65';
  const sw=sel?2.9:r.train?1:1.5;
  if(r.c===0)body+=`<circle cx="${cx}" cy="${cy}" r="${sel?7:3.9}" fill="${colors[0]}" opacity="${alpha}" stroke="${stroke}" stroke-width="${sw}"/>`;
  else if(r.c===1)body+=`<rect x="${cx-(sel?6.5:3.5)}" y="${cy-(sel?6.5:3.5)}" width="${sel?13:7}" height="${sel?13:7}" rx="1.5" fill="${colors[1]}" stroke="${stroke}" stroke-width="${sw}" opacity="${alpha}"/>`;
  else body+=`<path d="M${cx} ${cy-(sel?8:5)} L${cx+(sel?7.5:4.5)} ${cy+(sel?6:4)} L${cx-(sel?7.5:4.5)} ${cy+(sel?6:4)}Z" fill="${colors[2]}" stroke="${stroke}" stroke-width="${sw}" opacity="${alpha}"/>`;
 }
 if(selected>=0){const r=sample[selected];body+=`<circle cx="${rx(r.x)}" cy="${ry(r.y)}" r="12" fill="none" stroke="#1f426c" stroke-width="2" stroke-dasharray="3 3"/>`;}
 body+='</svg>';return `<div class="plotwrap">${body}</div>`;
}

function confusion(key='log',cell=0,mode='select'){
 const rep=report(key),a=Math.floor(cell/3),b=cell%3;
 let g=`<div class="cmgrid"><div class="cmcorner">真實 ↓\n預測 →</div>${names.map(n=>`<div class="cmhead">${n}</div>`).join('')}`;
 for(let i=0;i<3;i++){
  g+=`<div class="cmrowhead">${names[i]}</div>`;
  for(let j=0;j<3;j++){
   const chosen=mode==='select'?cell===i*3+j:mode==='good'?i===j:i!==j;
   const mark=mode==='select'&&chosen?'selected':mode!=='select'&&!chosen?'dim':'';
   g+=`<button data-cell="${i*3+j}" class="cmcell ${i===j?'good':'bad'} ${mark}" type="button">${rep.cm[i][j]}</button>`;
  }
 }
 g+='</div>';
 const ids=raw.test.filter(id=>sample[id].c===a&&predict(key,sample[id].x,sample[id].y)===b);
 const text=a===b?'預測正確':'預測錯誤';
 const note=mode==='select'?`<div class="cmnote">真實：<b>${names[a]}</b><br>預測：<b>${names[b]}</b><strong>${rep.cm[a][b]} 筆</strong>${text}${ids.length?`<div style="font-size:12px;margin-top:8px">樣本 #${ids.slice(0,5).map(x=>x+1).join('、#')}</div>`:''}</div>`:`<div class="cmnote"><b>${mode==='good'?'主對角線＝正確':'非對角線＝誤判'}</b><strong>${mode==='good'?rep.good:rep.bad} 筆</strong>全體測試 45 筆</div>`;
 return `<div class="cmwrap">${g}${note}</div>`;
}

function syntax(code){
 const keys=new Set(['if','else','elif','for','in','def','return','import','as','from','and','or','not']);
 const calls=new Set(['print','len','range','sum','min','max','fit','predict','predict_proba','train_test_split','LogisticRegression','DecisionTreeClassifier','accuracy_score','confusion_matrix','round','DataFrame']);
 const parts=code.match(/(?:"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|\b\d+(?:\.\d+)?\b|\b[A-Za-z_]\w*\b|==|!=|<=|>=|\+=|-=|\*\*|\/\/|[+\-*\/%=<>]|\s+|.)/g)||[];
 return parts.map((t,i)=>{let type='';if(/^["']/.test(t))type='tok-str';else if(/^\d/.test(t))type='tok-num';else if(keys.has(t))type='tok-key';else if(['True','False','None'].includes(t))type='tok-bool';else if(['np','pd','plt','sklearn'].includes(t))type='tok-module';else if(calls.has(t)||t==='model'&&parts[i+1]==='.')type='tok-call';else if(/^[A-Za-z_]\w*$/.test(t))type='tok-var';else if(/^[+\-*\/%=<>!]+$/.test(t))type='tok-op';return type?`<span class="${type}">${esc(t)}</span>`:esc(t);}).join('');
}

 predict:`第 ${r.id+1} 筆測試花朵，真實為 ${names[r.c]}，預測為 ${names[predict('log',r.x,r.y)]}。`,

 confusion:'矩陣的列是真實類別，欄是預測類別；目前點選的格子會顯示其具體意義。',
 readcm:z.mode===0?`主對角線共有 ${log.good} 筆，代表分類正確。`:z.mode===1?`非對角線共有 ${log.bad} 筆，代表誤判。`:'同一張矩陣不只能算 Accuracy，也看得到誤判發生的方向。',
 start3:z.mode?'決策樹常形成水平與垂直分割的區域。':'邏輯斯迴歸此處以線性類別分數畫出較平滑的決策區域。',
 treepath:`樣本 #${r.id+1} 的花瓣寬度是 ${r.y} cm，沿著高亮路徑得到 ${names[predict('tree2',r.x,r.y)]}。`,
 depth:`深度 ${z.depth}：訓練集 ${pct(report('tree'+z.depth,'train').acc)}，測試集 ${pct(report('tree'+z.depth).acc)}。更深不保證新資料更準。`,
 fitcurve:'比較同一組 Iris 樣本：深度 1 可能太簡單；深度 5 的訓練分數更高，但測試分數反而較低。',
 compare:`目前是 ${modelLabel(m)}，測試集 ${mt.good}/45 正確；請用相同測試資料來比較不同模型。`,
 cmcompare:`目前是 ${modelLabel(m)}：測試集共 ${mt.bad} 筆分類錯誤，矩陣會隨模型改變。`,
 pr:'TP 是真正類、FP 是誤報、FN 是漏報。評估特定類別時，先明確指定它是正類。',
 newflower:`你的新花：長 ${fmt(z.flen,1)} cm、寬 ${fmt(z.fwidth,1)} cm；邏輯斯迴歸預測 ${names[predict('log',z.flen,z.fwidth)]}，決策樹深度 3 預測 ${names[predict('tree3',z.flen,z.fwidth)]}。`,
 challenge:`目前使用 ${modelLabel(m)}，訓練準確率 ${pct(mtr.acc)}，測試準確率 ${pct(mt.acc)}；這是固定資料切分的觀察結果。`
 };
 return `<div class="smallhead">觀察重點</div><p class="note">${esc(dynamic[s.kind]||s.observe)}</p>`;
}
function aside(s,z){
 if(s.kind==='quiz'){
  const q=s.questions[z.q];return `<div class="smallhead">快速檢核</div><div class="lead">${esc(s.lead)}</div>${z.correct?`<div class="quizexplain">${esc(q.why)}</div>`:z.wrong?`<div class="quizhint">提示：${esc(q.hint)}</div>`:`<p class="note">選擇答案後，檢查自己的想法。</p>`}<div class="think">${esc(s.think)}</div>`;
 }
 const code=codeFor(s,z);
 return `<div class="smallhead">核心概念</div><div class="lead">${esc(s.lead)}</div>${exp(s,z)}${code?editor(code):''}<div class="think">思考一下｜${esc(s.think)}</div>`;
}
function avatar(){return `<svg class="avatar" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="22" fill="#e8ebff"/><path d="M8 44q4-14 14-14t14 14" fill="#5c74bb"/><ellipse cx="22" cy="20" rx="11" ry="13" fill="#f7c5a8"/><path d="M11 19q-3-16 11-15 13-1 12 16l-4-8-8-2-8 5z" fill="#495184"/><circle cx="18" cy="21" r="1.3" fill="#3e5578"/><circle cx="26" cy="21" r="1.3" fill="#3e5578"/><path d="M19 26q3 3 6 0" fill="none" stroke="#be7883" stroke-width="1.4" stroke-linecap="round"/></svg>`;}
function render(){
 const s=slides[page],z=st(),local=page%10+1;
 root.innerHTML=`<div class="slidehead"><div class="meta"><div class="brand">${avatar()}<span>課程系列｜Python 與資料分析</span><span class="subbrand">教學主題｜分類模型與評估</span></div><span class="chip">第 ${s.section} 節 ／ 3 節</span></div><div class="titleline"><h1>${esc(s.title)}</h1><span class="topicnum">${['認識分類','LOGISTIC REGRESSION','DECISION TREE'][s.section-1]} · ${String(local).padStart(2,'0')}</span></div></div><div class="content"><section class="mainpanel"><div class="panelhead"><span class="panellabel">${s.kind==='quiz'?'快速檢核｜3 題':'觀察與操作｜互動示範'}</span><span class="panelhint">${s.kind==='quiz'?'答錯只有提示，答對才有解析':'改變條件，觀察圖形與結果同步變化'}</span></div><div id="viz"></div><div id="controls"></div></section><aside class="sidepanel" id="aside"></aside></div><footer class="foot"><div class="footerMeta"><div class="footnotice">← / → 逐頁移動　·　G 投影片總覽　·　H 操作說明</div></div><div class="progress">${slides.map((x,i)=>`<span class="pseg ${i<page?'done':i===page?'now':''}"></span>`).join('')}</div><div class="nav"><span class="numlabel">${page+1} / ${slides.length}</span><button data-nav="-1" ${page===0?'disabled':''}>上一頁</button><button class="next" data-nav="1" ${page===slides.length-1?'disabled':''}>下一頁</button></div></footer>`;
 dynamic(true);if(overlay)showOverlay();
}
function dynamic(refreshControls=false){const s=slides[page],z=st();document.getElementById('viz').innerHTML=renderVisual(s,z);document.getElementById('aside').innerHTML=aside(s,z);if(refreshControls)document.getElementById('controls').innerHTML=controls(s,z);}
function slideTo(n){page=clamp(n,0,slides.length-1);overlay='';render();}
function downloadCsv(){const head='id,sepal_length,sepal_width,petal_length,petal_width,species';const body=sample.map(r=>[r.id+1,r.a,r.b,r.x,r.y,names[r.c]].join(','));const content='\ufeff'+[head,...body].join('\r\n')+'\r\n';const blob=new Blob([content],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='iris_classification.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);}
function showOverlay(){
 const content=overlay==='overview'?`<h2>投影片總覽｜${slides.length} 張</h2><div class="overview">${slides.map((s,i)=>`<button data-goto="${i}" class="${page===i?'active':''}">${String(i+1).padStart(2,'0')}｜${esc(s.title)}</button>`).join('')}</div>`:`<h2>投影片操作說明</h2><div class="helptext">← / →：切換上一張／下一張<br>G：開啟投影片總覽　H：開啟操作說明<br>F：全螢幕　Esc：關閉視窗<br><small>本檔可離線操作。程式碼為 Python 範例，請使用 VS Code 或 Google Colab 執行。</small></div>`;
 root.insertAdjacentHTML('beforeend',`<div class="overveil"><div class="overlay"><button class="closeoverlay" data-action="close">關閉 ×</button>${content}</div></div>`);
}
function resize(){const scale=Math.min(innerWidth/1280,innerHeight/720);root.style.transform=`scale(${scale})`;root.style.left=`${(innerWidth-1280*scale)/2}px`;root.style.top=`${(innerHeight-720*scale)/2}px`;}
root.addEventListener('click',event=>{
 const b=event.target.closest('button');if(!b||b.disabled)return;
 if(b.hasAttribute('data-nav')){slideTo(page+Number(b.dataset.nav));return;}
 if(b.hasAttribute('data-goto')){slideTo(Number(b.dataset.goto));return;}
 const z=st();
 if(b.hasAttribute('data-answer')){const q=slides[page].questions[z.q],idx=Number(b.dataset.answer);z.answer=idx;z.correct=idx===q.ok;z.wrong=!z.correct;dynamic(false);return;}
 for(const field of ['mode','idx','filter','depth','model','cell','cls']){
  if(b.hasAttribute('data-'+field)){z[field]=field==='model'?b.dataset.model:Number(b.dataset[field]);dynamic(true);return;}
 }
 switch(b.dataset.action){
 case 'prevq':z.q=clamp(z.q-1,0,2);z.answer=-1;z.correct=z.wrong=false;dynamic(true);return;
 case 'nextq':z.q=clamp(z.q+1,0,2);z.answer=-1;z.correct=z.wrong=false;dynamic(true);return;
 case 'csv':downloadCsv();return;
 case 'close':overlay='';render();return;
 }
});
root.addEventListener('input',event=>{
 const input=event.target;if(!input.matches('input[data-range]'))return;
 const z=st(),key=input.dataset.range;z[key]=Number(input.value);
 const output=document.getElementById('out-'+key);if(output)output.textContent=fmt(z[key],1)+' cm';
 dynamic(false);
});
document.addEventListener('keydown',event=>{
 if(event.key==='Escape'&&overlay){overlay='';render();return;}
 if(overlay||/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement?.tagName||''))return;
 if(event.key==='ArrowRight'||event.key==='PageDown'){event.preventDefault();slideTo(page+1);}
 else if(event.key==='ArrowLeft'||event.key==='PageUp'){event.preventDefault();slideTo(page-1);}
 else if(event.key.toLowerCase()==='g'){overlay='overview';showOverlay();}
 else if(event.key.toLowerCase()==='h'||event.key==='?'){overlay='help';showOverlay();}
 else if(event.key.toLowerCase()==='f'){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.();}
});
window.addEventListener('resize',resize);
resize();render();
</script></body></html>
