</style></head><body><div id="deck" role="application" aria-label="LLM API 運用實務互動式投影片"></div><script>const slides=[{"section":1,"kind":"cover","title":"一句問題，怎麼透過 API 變成 AI 回答？","lead":"大型語言模型（Large Language Model, LLM）能處理自然語言；程式可以透過 API 傳送問題、接收回覆。","observe":"點選流程中的任一步，觀察使用者、Python、雲端模型各自負責什麼。","think":"為什麼程式不能只把一句話寫在畫面上，就說它已經請 AI 回答？","code":"","opts":["輸入問題","送出 API 請求","模型產生回覆","顯示結果"],"questions":[],"notes":[]},{"section":1,"kind":"rules","title":"一般程式和 LLM：處理文字的方法不同","lead":"一般條件判斷依照程式寫好的規則回答；LLM 可根據輸入與上下文生成文字，但也可能答錯。","observe":"切換同一個學習問題，對照固定規則與模型可能的回應方式。","think":"能產生自然回答，是否就代表每一句都符合事實？","code":"","opts":["固定規則","LLM 生成"],"questions":[],"notes":[]},{"section":1,"kind":"token","title":"模型回覆不是整篇一次寫好","lead":"文字會被切成 Token（詞元）；語言模型根據當前上下文逐步生成後續 Token。","observe":"依序揭示一則簡短回答的生成步驟。這是教學示意，不是實際 Gemini 的 Token 切法或輸出。","think":"如果前面已經寫出不同的字，接下來可能出現的字會一樣嗎？","code":"","opts":["輸入問題","生成第 1 段","生成第 2 段","生成第 3 段"],"questions":[],"notes":[]},{"section":1,"kind":"prompt","title":"同一個問題，Prompt 寫法會影響結果","lead":"Prompt（提示詞）是交給模型的任務需求。具體交代目的、限制與格式，比只有一句模糊要求更容易核對。","observe":"將「幫我介紹 Python」逐步改寫成可執行、可檢查的學習需求。","think":"哪一版能讓你清楚知道，怎樣才算回答成功？","code":"","opts":["模糊需求","說清楚對象與任務","加入長度與格式"],"questions":[],"notes":[]},{"section":1,"kind":"builder","title":"把提示詞拆成四個可觀察的條件","lead":"一個清楚的 Prompt 常包含任務、背景、限制與輸出格式；不必每次全部使用，但要確定必要資訊沒有漏掉。","observe":"點選條件加入提示詞，右側文字會立即組合成一份可用指令。","think":"若要求輸出兩個例子，卻沒有寫清楚範圍，會發生什麼問題？","code":"","opts":["任務","背景","限制","輸出格式"],"questions":[],"notes":[]},{"section":1,"kind":"request","title":"API：程式和遠端服務如何交換資料？","lead":"API（Application Programming Interface，應用程式介面）提供規定好的呼叫方式；請求（request）與回應（response）是兩個不同方向的資料。","observe":"切換四個階段，追蹤 prompt 從 Python 送出，到程式讀到 response 的過程。","think":"取得 response 後，應從哪裡讀取產生的文字？","code":"","opts":["組成輸入","發出請求","收到回應","讀取文字"],"questions":[],"notes":[]},{"section":1,"kind":"key","title":"API Key 是存取憑證，不是題目內容","lead":"API Key 用於驗證 API 存取權限。外洩可能被他人使用配額或造成費用，不能公開在 GitHub、投影片或前端程式碼。","observe":"切換三種放置方式，辨別哪一種較適合 Python 課堂練習。","think":"為什麼將 API Key 貼在公開網頁的 JavaScript 裡也不安全？","code":"","opts":["寫死在程式碼","環境變數","公開在前端"],"questions":[],"notes":[]},{"section":1,"kind":"roles","title":"System 和 User：指令有不同來源","lead":"System instruction 用來設定助理行為；User 提供當次任務。模型產生的回覆不是新的使用者命令。","observe":"點選訊息角色，觀看同一段對話的來源與作用。","think":"User 可以提出新問題，是否就代表 System 規則一定會被改寫？","code":"","opts":["System 指令","User 問題","Model 回覆"],"questions":[],"notes":[]},{"section":1,"kind":"safe","title":"把 API Key 放在自己的環境中","lead":"使用 Google AI Studio 建立／管理 Key，再以 GEMINI_API_KEY 環境變數提供給 Python。安裝套件、登入與實際呼叫需要連網。","observe":"依序觀察取得 Key、設定環境與啟動 Python 的流程。畫面只顯示遮蔽的假 Key。","think":"如果已將 Key 推上公開儲存庫，單純刪除最新一筆程式碼就夠了嗎？","code":"pip install -U google-genai","opts":["AI Studio 建立 Key","設定環境變數","Python 讀取憑證"],"questions":[],"notes":[]},{"section":1,"kind":"quiz","title":"第一節快速檢核","lead":"確認 LLM、Prompt、API request／response 與 API Key 的基本概念。","observe":"直接點選選項作答，答錯只提供提示；答對後才能查看完整解析。","think":"下一節將真正使用 Python 呼叫 Gemini API。","code":"","opts":[],"questions":[{"prompt":"下列哪一個最符合 API request 與 response 的差異？","choices":["兩個都是使用者輸入","request 是送出的資料，response 是收到的結果","response 就是 API Key","API 沒有資料傳送"],"ok":1,"hint":"想想資料是從 Python 往哪個方向流動。","why":"Python 將輸入與必要設定組成 request，API 服務處理後回傳 response，程式再讀取其中結果。"},{"prompt":"哪個地方較適合保存 Python 程式使用的 Gemini API Key？","choices":["公開 GitHub 程式碼","HTML 網頁原始碼","GEMINI_API_KEY 環境變數","投影片中的截圖"],"ok":2,"hint":"存取憑證應避免直接出現在會分享出去的檔案裡。","why":"對個人練習，環境變數是官方建議方式之一；正式服務可改用適當的祕密管理機制。"},{"prompt":"為什麼清楚的 Prompt 通常更容易取得可檢查的回答？","choices":["一定不會產生錯誤","模型可知道任務、限制與格式","可不需要網路","不會使用 Token"],"ok":1,"hint":"提示詞有沒有告訴模型「要做什麼、做到什麼程度」？","why":"具體的任務、背景、限制與格式能減少需求不明確的情況；但仍需核對模型回覆是否正確。"}],"notes":[]},{"section":2,"kind":"start2","title":"第二節：用 Python 取得第一則 AI 回覆","lead":"這一節使用 Google 官方 Python SDK `google-genai`。從建立 client，到送出內容與顯示回覆，流程只有幾個主要步驟。","observe":"依序切換「環境 → client → request → response」，注意哪個部分真正需要 API 金鑰。","think":"投影片的示範回覆是預先設計的；真正執行程式必須連線並有有效的 Key。","code":"from google import genai\nclient = genai.Client()","opts":["安裝與環境","建立 client","送出 request","取得 response"],"questions":[],"notes":[]},{"section":2,"kind":"setup","title":"先裝好 SDK，再確認 Key 不在程式裡","lead":"在 VS Code 或 Colab 的 Python 環境中安裝套件；將 GEMINI_API_KEY 設定為環境變數，不要將金鑰直接寫進可分享的 notebook。","observe":"切換 Windows／macOS／Colab 的概念步驟，檢查環境是否設定。","think":"為什麼設定完 Windows 環境變數後，可能需要重開終端機？","code":"pip install -U google-genai","opts":["安裝 SDK","Windows 設定","Colab Secrets"],"questions":[],"notes":[]},{"section":2,"kind":"client","title":"三段程式：client、input、response","lead":"`genai.Client()` 讀取環境中的認證設定；`interactions.create()` 送出輸入；`output_text` 取得文字回覆。","observe":"切換三段，主圖會指出哪個物件或欄位在那一步使用。","think":"為什麼 `print(reply)` 和 `print(reply.output_text)` 不是同一件事？","code":"from google import genai\nclient = genai.Client()\nreply = client.interactions.create(\n    model=\"gemini-3.8-flash\",\n    input=\"請用一句話解釋什麼是 API。\"\n)\nprint(reply.output_text)","opts":["建立 client","送出輸入","取出文字"],"questions":[],"notes":[]},{"section":2,"kind":"input","title":"換一個 input，送出的問題就不同","lead":"程式可以把不同的使用者文字放在 `input` 參數裡，而不是每次複製一段全新的程式。","observe":"切換三種問題，比較 request 的 input 欄位及教學模擬回覆。","think":"你會先用什麼方式確認使用者輸入不是空白？","code":"question = \"什麼是變數？\"\nreply = client.interactions.create(\n    model=\"gemini-3.8-flash\",\n    input=question\n)\nprint(reply.output_text)","opts":["問變數","問 list","問函式"],"questions":[],"notes":[]},{"section":2,"kind":"response","title":"response 不只有一整段顯示文字","lead":"SDK 回傳的是包含多種資訊的物件；初學時可先使用 `output_text` 讀取模型輸出，再由程式決定如何呈現。","observe":"點選「完整回應物件／抽出文字／顯示到畫面」，觀察資料在哪一步被取出。","think":"模型可能沒有產生可顯示文字；實作時為什麼需要處理這種情況？","code":"text = reply.output_text\nprint(text)","opts":["回應物件","讀取 output_text","顯示文字"],"questions":[],"notes":[]},{"section":2,"kind":"system","title":"讓回答風格固定：system_instruction","lead":"`system_instruction` 可以描述希望模型保持的風格，例如使用臺灣繁體中文、句子簡短。它是行為指引，不保證模型絕對正確。","observe":"切換三種系統指令，觀察同一個 user 問題的模擬回答呈現方式。","think":"如果 User 只寫「什麼是迴圈」，你會把固定回答風格放在哪裡？","code":"reply = client.interactions.create(\n    model=\"gemini-3.8-flash\",\n    system_instruction=\"請用臺灣繁體中文，兩句內回答。\",\n    input=\"什麼是迴圈？\"\n)","opts":["沒有指定","兩句話","條列重點"],"questions":[],"notes":[]},{"section":2,"kind":"format","title":"固定輸出格式，才能接著整理資料","lead":"如果下游程式需要固定欄位，Prompt 應清楚要求欄位名稱；缺少的資訊應標註「未提供」，不能自行捏造。","observe":"切換「自由回答」與「欄位輸出」，比較同一則社團通知被整理的結果。","think":"輸入沒有寫到地點時，系統應不應該自己填一個教室號碼？","code":"question = \"請列出活動、日期、地點；缺漏寫未提供。\"","opts":["自由摘要","指定欄位","缺少資訊處理"],"questions":[],"notes":[]},{"section":2,"kind":"errors","title":"API 呼叫失敗：先辨認哪個環節有問題","lead":"連線不穩、Key 無效、權限不足、配額限制或模型名稱錯誤，都可能使呼叫失敗；應查看實際錯誤訊息再處理。","observe":"切換四種故障情境，查看錯誤發生的位置與合理的下一步。","think":"為什麼不應無限制地重試失敗的呼叫？","code":"try:\n    reply = client.interactions.create(\n        model=\"gemini-3.8-flash\",\n        input=\"你好\"\n    )\nexcept Exception as err:\n    print(type(err).__name__)","opts":["Key／權限","配額或速率","模型名稱","網路連線"],"questions":[],"notes":[]},{"section":2,"kind":"practice","title":"實作小任務：做一個單次問答程式","lead":"把問題設在 `question`，呼叫 Gemini API 後印出回覆。先測一個簡單問題，再替換成自己的課堂題目。","observe":"切換輸入問題與回覆區，確認程式的每一步；回覆內容為教學模擬，不會發送到 Google。","think":"怎麼驗證回覆不是只看起來流暢，而是真的回答了原問題？","code":"from google import genai\nclient = genai.Client()\nquestion = \"請用兩句話解釋 list。\"\nreply = client.interactions.create(\n    model=\"gemini-3.8-flash\",\n    input=question\n)\nprint(reply.output_text)","opts":["輸入問題","送出請求","閱讀回覆","核對結果"],"questions":[],"notes":[]},{"section":2,"kind":"quiz","title":"第二節快速檢核","lead":"確認 Python SDK 的主要元件、system instruction、回覆處理與錯誤排查。","observe":"先作答，再根據提示或完整解析修正理解。","think":"下一節要把單次呼叫延伸為能接續聊天的助理。","code":"","opts":[],"questions":[{"prompt":"`client.interactions.create()` 在這份程式中主要負責什麼？","choices":["建立 Python 變數型態","向 Gemini API 送出請求","安裝套件","刪除金鑰"],"ok":1,"hint":"觀察呼叫前需要 client，呼叫後才有 reply。","why":"`interactions.create()` 送出模型、輸入等設定並取得互動結果；讀取 `reply.output_text` 可取回生成的文字。"},{"prompt":"想設定所有回答都使用臺灣繁體中文，應優先放在哪裡？","choices":["system_instruction","print() 的括號裡","API Key 的文字裡","檔案副檔名"],"ok":0,"hint":"這項要求是每一輪都會用到的助理行為設定。","why":"`system_instruction` 用來傳達較固定的行為規則；User 的 input 則放該次具體問題。"},{"prompt":"若 API 出現配額或速率限制，較合理的處理方式是？","choices":["一直無限重試","把 API Key 公開求助","確認限制與用量，稍後依規則重試","假裝 API 已成功"],"ok":2,"hint":"應先看失敗原因，而不是忽略錯誤訊息。","why":"配額與速率限制需要查看帳戶限制、用量與服務回覆；重試必須有限制，避免更多不必要請求。"}],"notes":[]},{"section":3,"kind":"start3","title":"第三節：把單次問答接成一段對話","lead":"同一個問題若需要前文脈絡，程式就要將先前資訊提供給模型，或使用可延續的互動工作階段。","observe":"切換「只有最新訊息」與「有前文」，比較模型能看到的內容。","think":"沒有上下文時，「它有哪些用法？」裡的「它」究竟指什麼？","code":"","opts":["沒有前文","帶入前文"],"questions":[],"notes":[]},{"section":3,"kind":"history","title":"哪些對話需要保留？哪些可以省略？","lead":"聊天紀錄不是越長越好。用簡短的對話示範保留與當前任務有關的資訊；上下文仍可能受到 Token 限制。","observe":"切換只保留最新問題、保留關鍵前文、保留全部訊息，觀察可理解程度與資料量。","think":"假如討論的是 Python list，哪些早期訊息其實可以不用再傳？","code":"","opts":["只保留最新","保留必要前文","保留全部"],"questions":[],"notes":[]},{"section":3,"kind":"chat","title":"使用 Chat 工作階段管理多輪對話","lead":"SDK 的 `client.chats.create()` 可建立對話工作階段；之後 `send_message()` 會延續此物件中的聊天脈絡。","observe":"切換第 1、2、3 輪，觀察上一輪內容如何讓後續追問有意義。","think":"如果重新啟動程式，原本 Python 記憶體中的 chat 物件還會自動存在嗎？","code":"chat = client.chats.create(\n    model=\"gemini-3.8-flash\"\n)\nreply = chat.send_message(\"我在學 list。\")\nprint(reply.text)\nreply = chat.send_message(\"請給兩例。\")\nprint(reply.text)","opts":["第 1 輪","第 2 輪","第 3 輪"],"questions":[],"notes":[]},{"section":3,"kind":"tone","title":"同一段對話，可以設定不同回答風格","lead":"回答風格可以在 system instruction 中指定；例如簡潔、條列或逐步解釋。變更風格不等於改變事實答案。","observe":"選擇不同風格，比較同一題目在畫面上的呈現差異。","think":"如果想讓助理保持「先舉例再解釋」，應如何設定？","code":"","opts":["簡潔回答","生活例子","三步驟解釋"],"questions":[],"notes":[]},{"section":3,"kind":"fixed","title":"做成可整理的固定欄位輸出","lead":"實用的回覆不只要好讀，還要方便程式處理。設計欄位、空值規則、順序，減少不同回答格式難以接續的問題。","observe":"點選社團活動通知，觀察輸入原文與固定欄位的對應；沒有給的地點一定是「未提供」。","think":"如果欄位名稱有時叫「日期」、有時叫「時間」，後續程式會發生什麼問題？","code":"question = \"輸出活動、日期、地點；缺漏寫未提供。\"","opts":["通知 A","通知 B","原文缺漏"],"questions":[],"notes":[]},{"section":3,"kind":"verify","title":"AI 可能說得流暢，卻沒有可靠根據","lead":"生成式 AI 可能產生不存在或無法查證的資訊（常稱 Hallucination，幻覺）。重要內容要對照原始資料或可靠來源。","observe":"切換三種候選回答，直接標出哪些句子有證據、哪些是額外猜測。","think":"模型若補上一個看似合理的教室地點，這能直接當成真實公告嗎？","code":"","opts":["有資料支持","加入未提供資訊","缺少來源"],"qu function codeFor(s,z){

 if(s.kind==='input')return `question = "${['什麼是變數？','什麼是 list？','什麼是函式？'][m]}"\nreply = client.interactions.create(\n    model="gemini-3.8-flash",\n    input=question\n)\nprint(reply.output_text)`;

    input="什麼是迴圈？"

}
function syntax(src){
 const keys=new Set(['import','from','as','if','else','elif','for','in','try','except','print','return','def','not','True','False','None']);
 const calls=new Set(['print','Client','create','getenv','send_message','get','str','bool','chat']);
 return (src.match(/(?:"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|\b\d+(?:\.\d+)?\b|\b[A-Za-z_]\w*|\s+|.)/g)||[]).map(t=>{
 let cls='';if(/^['"]/.test(t))cls='tok-str';else if(/^\d/.test(t))cls='tok-num';else if(keys.has(t))cls='tok-key';else if(['genai','os','userdata','google'].includes(t))cls='tok-module';else if(calls.has(t))cls='tok-call';else if(/^\w/.test(t))cls='tok-var';return cls?`<span class="${cls}">${esc(t)}</span>`:esc(t);
 }).join('');
}

 if(['ArrowRight','PageDown'].includes(e.key)){e.preventDefault();go(page+1);}

function resize(){const scale=Math.min(innerWidth/1280,innerHeight/720);root.style.transform=`scale(${scale})`;root.style.left=`${(innerWidth-1280*scale)/2}px`;root.style.top=`${(innerHeight-720*scale)/2}px`;}
window.addEventListener('resize',resize);
resize();render();
